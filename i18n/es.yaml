# Página de inicio (layouts/home.html)
home_eyebrow: "Sin fines de lucro y de código abierto"
home_title: "Cada gato tiene una historia."
home_title_accent: "Hagamos que lo acompañe."
home_lede: "StrayCats es una app de código abierto y sin fines de lucro, todavía en camino, para cualquiera que cuide o alimente a un gato. Te permitirá ver la historia de un gato y sumarle, para que no se pierda nada cuando el gato cambia de manos."
home_cta_primary: "Hablemos de tus gatos"
home_cta_secondary: "Lee las historias"
home_status: "Todavía no hay app. Se está diseñando a la vista de todos, y tú puedes ayudar a darle forma."
home_photo_alt: "Saibo, un gato gris de pecho blanco, mirando a la cámara con una pata blanca apoyada en una mano"
home_photo_caption: "Saibo, 2010–2026. StrayCats está dedicado a él."
home_who_title: "Para quien cuida a un gato"
home_who_lede: "Esto es lo que StrayCats quiere hacer, cuando exista."
home_who_owners: "Quienes tienen gato"
home_who_owners_text: "Ten la historia de tu gato en un solo lugar y descubre quién más lo conoce en sus paseos."
home_who_feeders: "Quienes alimentan a los gatos del barrio"
home_who_feeders_text: "Encuentra a las demás personas que alimentan a los mismos gatos y deja lo que sabes si te mudas."
home_who_shelters: "Refugios y voluntarios"
home_who_shelters_text: "Entrega cada gato a su nuevo hogar con su historia: sus nombres, costumbres, salud y quién lo conoció antes."
home_who_travelers: "Amantes de los gatos y viajeros"
home_who_travelers_text: "Conoce a un gato con una foto, en tu calle o de vacaciones, y ese encuentro pasa a ser parte de su historia."
home_how_title: "Cómo va a funcionar"
home_how_meet: "Conoce a un gato con una foto"
home_how_meet_text: "Cuando conozcas a un gato, sácale una foto. Esa es la presentación: sin formularios ni complicaciones."
home_how_grow: "Su historia crece con cada encuentro"
home_how_grow_text: "Cada encuentro suma un poco a una sola historia compartida que se queda con el gato, se llame como se llame y duerma donde duerma."
home_how_network: "Quienes lo cuidan se encuentran"
home_how_network_text: "Vecinos, dueños y voluntarios que cuidan en silencio al mismo gato pueden encontrarse, sin revelar dónde viven."
home_read_idea: "Lee la idea"
home_how_principles: "[La privacidad y la seguridad del gato van primero]({{ .Privacy }}): sin ubicaciones exactas ni clasificaciones. [Los datos son abiertos]({{ .Open }}) y ninguna empresa manda sola."
home_now_title: "Dónde estamos"
home_now_lede: "Todavía no hay app ni código, [a propósito]({{ .Why }}). El primer software llegará cuando las ideas se hayan afinado con quienes cuidan gatos. Esto es lo que ya existe."
home_now_notebook: "Un cuaderno que crece"
home_now_notebook_text: "Historias que empiezan con un gato real, e ideas que siguen las preguntas que esas historias plantean."
home_now_notebook_link: "Empieza por las historias"
home_now_talks: "Hecho a base de conversaciones"
home_now_talks_text: "Las charlas con personas que cuidan gatos ya se han convertido en nuevas historias e ideas."
home_now_talks_link: "Agenda una charla"
home_now_open: "Código abierto"
home_now_open_text: "Las ideas y los diseños son públicos, y el código también lo será."
home_now_open_link: "Míralo en GitHub"
home_now_news: "Se actualiza seguido"
home_now_news_text: "Cada cambio se explica con palabras sencillas, para que veas qué hay de nuevo desde tu última visita."
home_now_news_link: "Novedades"
home_now_press: "Para prensa y amigos"
home_now_press_text: "Un kit de prensa y una pequeña tarjeta que puedes poner en tu propio sitio web."
home_now_press_link: "Kit de prensa"
home_now_embed_link: "Tarjeta para tu sitio"
home_listen_title: "¿Prefieres escuchar?"
home_listen_text: "Una introducción en audio de 90 segundos. Se hizo con NotebookLM de Google a partir de las páginas de este sitio, así que las dos voces son generadas por IA."
home_latest_title: "Historias recientes"
home_all_stories: "Ver todas las historias"
home_all_ideas: "Ver todas las ideas"
home_join_title: "Ayuda a darle forma a StrayCats"
home_join_text: "StrayCats se construirá con lo que ya saben quienes cuidan gatos. Cuéntame de los gatos de tu vida."
home_join_hello: "O simplemente saluda, en una o dos líneas. Leo personalmente cada mensaje:"
