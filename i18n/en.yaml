# Home page (layouts/home.html)
home_eyebrow: "Non-profit and open source"
home_title: "Every cat has a story."
home_title_accent: "Let's keep it with the cat."
home_lede: "StrayCats is a non-profit, open-source app in the making, for anyone who looks after or feeds a cat. It will let you see a cat's story and add to it, so nothing gets lost when the cat changes hands."
home_cta_primary: "Let's talk about your cats"
home_cta_secondary: "Read the stories"
home_status: "There's no app yet. It's being designed in the open, and you can help shape it."
home_photo_alt: "Saibo, a grey cat with a white chest, looking at the camera with one white paw resting on a hand"
home_photo_caption: "Saibo, 2010–2026. StrayCats is dedicated to him."
home_who_title: "For anyone who looks after a cat"
home_who_lede: "Here's what StrayCats is meant to do, once it exists."
home_who_owners: "Cat owners"
home_who_owners_text: "Keep your cat's story in one place, and find out who else knows it on its rounds."
home_who_feeders: "People who feed the cats nearby"
home_who_feeders_text: "Find the others who feed the same cats, and pass on what you know if you move away."
home_who_shelters: "Shelters and volunteers"
home_who_shelters_text: "Send each cat to its new home with its story: its names, habits, health, and who knew it before."
home_who_travelers: "Cat lovers and travelers"
home_who_travelers_text: "Meet a cat with one photo, on your street or on holiday, and your meeting becomes part of its story."
home_how_title: "How it will work"
home_how_meet: "Meet a cat with one photo"
home_how_meet_text: "When you meet a cat, take its picture. That's the introduction: no forms, no fuss."
home_how_grow: "Its story grows with every meeting"
home_how_grow_text: "Each meeting adds a little to one shared history that stays with the cat, whatever it's called and wherever it sleeps."
home_how_network: "The people who care for it find each other"
home_how_network_text: "Neighbors, owners and volunteers who quietly look after the same cat can find each other, without giving away where they live."
home_read_idea: "Read the idea"
home_how_principles: "[Privacy and the cat's safety come first]({{ .Privacy }}): no exact locations and no rankings. [The data is open]({{ .Open }}), and no single company is in charge."
home_now_title: "Where things stand"
home_now_lede: "There's no app or code yet, [on purpose]({{ .Why }}). The first software comes after the ideas are shaped with the people who care for cats. Here's what exists today."
home_now_notebook: "A growing notebook"
home_now_notebook_text: "Stories that start with a real cat, and idea pages that follow the questions they raise."
home_now_notebook_link: "Start with the stories"
home_now_talks: "Shaped by conversations"
home_now_talks_text: "Talks with people who care for cats have already turned into new stories and ideas."
home_now_talks_link: "Book a chat"
home_now_open: "Open source"
home_now_open_text: "The ideas and designs are public, and the code will be too."
home_now_open_link: "See it on GitHub"
home_now_news: "Updated regularly"
home_now_news_text: "Every change is written up in plain words, so you can see what's new since your last visit."
home_now_news_link: "What's new"
