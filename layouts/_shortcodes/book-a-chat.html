{{- /* A "Book a chat" button linking to site.Params.chatURL. Text lives in i18n/.
  Usage: {{< book-a-chat >}} */ -}}
{{- with site.Params.chatURL -}}
<p><a class="respond-button" href="{{ . }}" target="_blank" rel="noopener">{{ i18n "chat_button" }}<span class="sr-only"> {{ i18n "opens_new_tab" }}</span></a></p>
{{- end -}}
