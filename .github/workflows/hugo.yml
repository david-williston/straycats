name: Deploy Hugo site to GitHub Pages

# Deploys a release: `npm run deploy` (scripts/release.mjs) tags main vYYYY.MM.DD[.N] and pushes the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"   # pinned; bump deliberately (also in pr-build.yml) after checking the build locally
          extended: true
      # actions/checkout stores the pushed tag as a lightweight tag; refetch the annotated tags
      # so the change history shows when each release was made.
      - run: git fetch --force --tags origin
      - run: node scripts/git-history.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
