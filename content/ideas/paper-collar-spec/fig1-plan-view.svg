<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 222" role="img"><title>Plan view of the paper collar, size M</title><desc>Horizontal strip 335 mm long with a ratchet head on the left, a calibrated weak link, an NFC pod, and a tooth field and tapered tail on the right.</desc>
