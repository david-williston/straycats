name = "straycats-visitor-notify"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Only the site itself may send hits.
ALLOWED_ORIGINS = "https://straycats.love"
# Only hits for well-formed page paths are passed on. The site is at the domain root, so "/" covers every page.
PATH_PREFIX = "/"
