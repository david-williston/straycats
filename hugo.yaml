baseURL: "https://david-williston.github.io/straycats/"
title: Stray Cats
theme: PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false   # English at /, Spanish at /es/

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

minify:
  disableXML: true
  minifyOutput: true

pagination:
  pagerSize: 20   # keep the home page on one page

outputs:
  home: [HTML, RSS, JSON]   # JSON powers the search page

params:
  env: production
  author: David Williston
  launched: 2026-10-03     # pages dated after this get a "New" badge for 14 days (post_meta.html)
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  displayFullLangName: true

  # The home page lists stories, then ideas, each in `weight` order (stories 1–99, ideas 100+).
  # The same order drives the previous/next links at the bottom of each page.
  mainSections: [posts, ideas]

  # Brand artwork: a portrait of Saibo (raster only; the source kit is kept outside the repo).
  # Favicons and home-screen icons are in static/ under the names PaperMod links by default.
  label:
    icon: images/saibo-badge.png
    iconHeight: 34
  images: [images/straycats-social.jpg]   # link preview for pages without a cover photo
  assets:
    theme_color: "#fbf6ef"

  # Each post ends with a "Respond to this idea" box (layouts/_partials/comments.html; text in i18n/).
  # Set this to the address that should receive replies.
  comments: true
  feedbackEmail: "david@davidwilliston.com"
  # Booking page for 30-minute chats (Let's talk page, Feedback page, reply box). Chats are in English.
  chatURL: "https://calendly.com/david-williston"

  # Ways to reach David (public). Used by the contact-channels / contact-strip shortcodes, the reply
  # box under each page, the footer and the Get involved page (layouts/_partials/contact-links.html).
  contact:
    telegramURL: "https://t.me/davidwilliston"
    telegramHandle: "@davidwilliston"
    whatsappURL: "https://wa.me/12368822034"
    whatsappNumber: "+1 236 882 2034"
    githubIssueURL: "https://github.com/david-williston/straycats/issues/new/choose"
    githubDiscussionsURL: "https://github.com/david-williston/straycats/discussions"
  # Leave these empty until they exist: everything that depends on them stays hidden.
  fundingURL: ""      # a page where people can chip in (the "Chip in" section of Get involved)
  newsletterURL: ""   # a sign-up page (shown under "Follow along" on Get involved)

  # Telegram note about each new visitor (see tools/visitor-notify/README.md). Set to "" to turn it off.
  visitorPingURL: "https://straycats-visitor-notify.evnsteven.workers.dev"

  socialIcons:
    - name: github
      url: "https://github.com/david-williston/straycats"
    - name: instagram
      url: "https://www.instagram.com/mimos_cat_sanctuary/"
    - name: rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/david-williston/straycats/edit/main/content"
    appendFilePath: true

  fuseOpts:
    keys: ["title", "permalink", "summary", "content"]

languages:
  en:
    label: English
    locale: en-us
    weight: 1
    params:
      description: "An open-source, non-profit idea to make caring for cats easier by letting anyone see a cat's story: your own, a neighbor's, a stray, a new adoption or one left behind."
      editPost:
        Text: "Suggest changes"
      footer:
        text: "Made with care for the people who care for cats. Dedicated to [Saibo](/saibo/), 2010–2026. · [What's new](/whats-new/) · [Press](/press/) {{< site-version >}} · {{< contact-strip involve=true >}}"
      homeInfoParams:
        Title: "Caring for a cat is easier when you know its story. 🐈"
        Content: >
          Your own cat, a neighbor's, a stray, a new adoption, a cat you had to give up, or one left
          behind: whoever cares for a cat has an easier time when they know its story. **Stray Cats** is
          the working name for an idea — open source, non-profit, and very much unfinished — for
          letting anyone who cares for a cat see its story, so nothing gets lost when a cat changes
          hands. It starts with the cats I've come to know in Puerto Escondido, Mexico. There's no
          app yet, and no code. Just stories, questions and
          half-formed ideas — and I'd love to hear yours. **The lightest way to help is a
          one-line hello:** {{< contact-strip >}}. I read every message myself, and
          [there are more ways to get involved](/involve/). Prefer to listen? There's a
          [90-second audio introduction](/about/#listen-to-the-idea). Been here before? See
          [what's new](/whats-new/).

          {{< talk-invite >}}
    menus:
      main:
        - {identifier: about, name: About, url: about/, weight: 10}
        - {identifier: ideas, name: Ideas, url: ideas/, weight: 20}
        - {identifier: posts, name: Stories, url: posts/, weight: 30}
        - {identifier: whatsnew, name: "What's New", url: whats-new/, weight: 35}
        - {identifier: involve, name: Get Involved, url: involve/, weight: 40}
        - identifier: search
          name: Search
          url: search/
          weight: 50
          pre: '<svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'

  es:
    label: Español
    locale: es-mx
    weight: 2
    params:
      description: "Una idea de código abierto y sin fines de lucro para que cuidar gatos sea más fácil, dejando que cualquiera vea la historia de un gato: el propio, el de un vecino, un callejero, uno recién adoptado o uno que quedó atrás."
      editPost:
        Text: "Sugerir cambios"
      footer:
        text: "Hecho con cariño para quienes cuidan gatos. Dedicado a [Saibo](/saibo/), 2010–2026. · [Novedades](/whats-new/) · [Prensa](/press/) {{< site-version >}} · {{< contact-strip involve=true >}}"
      homeInfoParams:
        Title: "Cuidar a un gato es más fácil cuando conoces su historia. 🐈"
        Content: >
          Tu propio gato, el de un vecino, un callejero, uno recién adoptado, uno que tuviste que dar
          o uno que quedó atrás: quien cuida a un gato lo tiene más fácil cuando conoce su historia.
          **Stray Cats** (Gatos Callejeros) es el nombre provisional de una idea, de código abierto,
          sin fines de lucro y todavía sin terminar, para que cualquiera que cuide a un gato pueda
          ver su historia y no se pierda nada cuando el gato cambia de manos. Empieza con los gatos
          que he llegado a conocer en Puerto Escondido, México. Todavía no hay app ni código. Solo
          historias, preguntas e ideas a medio formar, y me encantaría escuchar
          las tuyas. **La forma más ligera de ayudar es un saludo de una línea:**
          {{< contact-strip >}}. Leo personalmente cada mensaje, y hay
          [más formas de participar](/involve/). ¿Prefieres escuchar? Hay una [introducción en audio de 90
          segundos](/about/#escucha-la-idea). ¿Ya habías venido? Mira las [novedades](/whats-new/).

          {{< talk-invite >}}
    menus:
      main:
        - {identifier: about, name: Acerca de, url: acerca-de/, weight: 10}
        - {identifier: ideas, name: Ideas, url: ideas/, weight: 20}
        - {identifier: posts, name: Historias, url: posts/, weight: 30}
        - {identifier: whatsnew, name: Novedades, url: novedades/, weight: 35}
        - {identifier: involve, name: Cómo ayudar, url: como-ayudar/, weight: 40}
        - identifier: search
          name: Buscar
          url: search/
          weight: 50
          pre: '<svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'

privacy:
  youtube:
    privacyEnhanced: true   # embed from youtube-nocookie.com: no cookies until the visitor presses play

markup:
  goldmark:
    renderHooks:
      link:
        useEmbedded: always   # resolve /path/ links to the page so they work under the /straycats/ subpath
