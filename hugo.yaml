baseURL: "https://straycats.love/"
title: StrayCats
theme: PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false   # English at /, Spanish at /es/

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

minify:
  disableXML: true
  minifyOutput: true

pagination:
  pagerSize: 20

outputs:
  home: [HTML, RSS, JSON, Card]   # JSON powers the search page; Card is card.json for the embeddable supporter card

outputFormats:
  Card:
    mediaType: application/json
    baseName: card
    isPlainText: true
    notAlternative: true

params:
  env: production
  author: David Williston
  launched: 2026-10-03     # pages dated after this get a "New" badge for 14 days (post_meta.html)
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  displayFullLangName: true

  # Stories, then ideas, each in `weight` order (stories 1–99, ideas 100+): drives the RSS feed,
  # the archive and the previous/next links at the bottom of each page. The home page has its own
  # layout (layouts/home.html, text in i18n/ under home_) and shows the three newest stories.
  mainSections: [posts, ideas]

  # Brand artwork: a portrait of Saibo (raster only; the source kit is kept outside the repo).
  # Favicons and home-screen icons are in static/ under the names PaperMod links by default.
  label:
    text: StrayCats.love   # the site name in the header, with the domain
    icon: images/saibo-badge.png
    iconHeight: 34
  images: [images/straycats-social.jpg]   # link preview for pages without a cover photo
  assets:
    theme_color: "#fbf6ef"

  # Each post ends with a "Respond to this idea" box (layouts/_partials/comments.html; text in i18n/).
  # Set this to the address that should receive replies.
  comments: true
  feedbackEmail: "david@davidwilliston.com"
  # Booking page for 30-minute chats (Let's talk page, Feedback page, reply box). Chats are in English.
  chatURL: "https://calendly.com/david-williston"

  # Ways to reach David (public). Used by the contact-channels / contact-strip shortcodes, the reply
  # box under each page, the footer and the Get involved page (layouts/_partials/contact-links.html).
  contact:
    telegramURL: "https://t.me/davidwilliston"
    telegramHandle: "@davidwilliston"
    whatsappURL: "https://wa.me/12368822034"
    whatsappNumber: "+1 236 882 2034"
    githubIssueURL: "https://github.com/david-williston/straycats/issues/new/choose"
    githubDiscussionsURL: "https://github.com/david-williston/straycats/discussions"
  # Leave these empty until they exist: everything that depends on them stays hidden.
  fundingURL: "https://ko-fi.com/straycatsapp"    # a page where people can chip in (the "Chip in" section of Get involved)
  newsletterURL: ""   # a sign-up page (shown under "Follow along" on Get involved)

  # Embeddable supporter card for partner sites (static/card.js reads card.json; see the "embed" page).
  # `version` is informational only (bumping it does not bust caches); change it when the wording or logo
  # changes. Title, call to action and compact text are per language below; the description is each
  # language's `description`.
  card:
    version: 5

  # Telegram note about each new visitor (see tools/visitor-notify/README.md). Set to "" to turn it off.
  visitorPingURL: "https://straycats-visitor-notify.evnsteven.workers.dev"

  socialIcons:
    - name: github
      url: "https://github.com/david-williston/straycats"
    - name: instagram
      url: "https://www.instagram.com/mimos_cat_sanctuary/"
    - name: rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/david-williston/straycats/edit/main/content"
    appendFilePath: true

  fuseOpts:
    keys: ["title", "permalink", "summary", "content"]

languages:
  en:
    label: English
    locale: en-us
    weight: 1
    params:
      card:
        title: "StrayCats"
        cta: "Learn about the project"
        tagline: "An open-source, non-profit project to make caring for cats easier."
        compactText: "Supports the StrayCats project"
      description: "An open-source, non-profit project, growing in the open, to make caring for cats easier by letting anyone see a cat's story: your own, a neighbor's, a stray, a new adoption or one left behind."
      editPost:
        Text: "Suggest changes"
      footer:
        text: "Made with care for the people who care for cats. Dedicated to [Saibo](/saibo/), 2010–2026. · [What's new](/whats-new/) · [Press](/press/) {{< site-version >}} · {{< contact-strip involve=true >}}"
    menus:
      main:
        - {identifier: about, name: About, url: about/, weight: 10}
        - {identifier: ideas, name: Ideas, url: ideas/, weight: 20}
        - {identifier: posts, name: Stories, url: posts/, weight: 30}
        - {identifier: whatsnew, name: "What's New", url: whats-new/, weight: 35}
        - {identifier: involve, name: Get Involved, url: involve/, weight: 40}
        - identifier: search
          name: Search
          url: search/
          weight: 50
          pre: '<svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'

  es:
    label: Español
    locale: es-mx
    weight: 2
    params:
      card:
        title: "StrayCats"
        cta: "Conoce el proyecto"
        tagline: "Un proyecto de código abierto y sin fines de lucro para que cuidar gatos sea más fácil."
        compactText: "Apoya el proyecto StrayCats"
      description: "Un proyecto de código abierto y sin fines de lucro, que crece a la vista de todos, para que cuidar gatos sea más fácil, dejando que cualquiera vea la historia de un gato: el propio, el de un vecino, un callejero, uno recién adoptado o uno que quedó atrás."
      editPost:
        Text: "Sugerir cambios"
      footer:
        text: "Hecho con cariño para quienes cuidan gatos. Dedicado a [Saibo](/saibo/), 2010–2026. · [Novedades](/whats-new/) · [Prensa](/press/) {{< site-version >}} · {{< contact-strip involve=true >}}"
    menus:
      main:
        - {identifier: about, name: Acerca de, url: acerca-de/, weight: 10}
        - {identifier: ideas, name: Ideas, url: ideas/, weight: 20}
        - {identifier: posts, name: Historias, url: posts/, weight: 30}
        - {identifier: whatsnew, name: Novedades, url: novedades/, weight: 35}
        - {identifier: involve, name: Cómo ayudar, url: como-ayudar/, weight: 40}
        - identifier: search
          name: Buscar
          url: search/
          weight: 50
          pre: '<svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'

privacy:
  youtube:
    privacyEnhanced: true   # embed from youtube-nocookie.com: no cookies until the visitor presses play

markup:
  goldmark:
    renderHooks:
      link:
        useEmbedded: always   # resolve /path/ links to the page so they work under any subpath
